[tox]
envlist = py37,py38,py39,py310,py311,py312,py313,py314,pypy3
requires = tox-uv

[testenv]
# We want to test against the installed package instead of the source tree
changedir = .tox
dependency_groups = dev
commands = pytest --doctest-modules {env_site_packages_dir}/boltons {tox_root}/tests {posargs}

# Can't use pytest-mypy because we can't run mypy against a folder in the env where mypy is installed.
# So we just run mypy directly instead.
[testenv:mypy]
changedir = {toxinidir}
dependency_groups = dev
deps = -r docs/requirements-rtd.txt
setenv = MYPY_FORCE_COLOR=1
commands = mypy .
